# ============================================================
# 自愈工作流：定期检查被 GitHub 禁用的定时工作流，并自动重新启用。
#
# 作用：即使 run.yml / Keepalive 因某些原因被禁用，
#       本工作流会用 gh 命令把它们重新 enable，无需手动操作。
# 注意：gh workflow enable 是幂等操作，对已启用的工作流执行也不会报错。
#
# 使用：把本文件放到仓库 .github/workflows/ 目录并提交即可。
# ============================================================
name: Workflow Watchdog

on:
  schedule:
    # 每月 1、8、15、22 号 UTC 03:00 检查一次（北京时间 11:00）
    - cron: '0 3 1,8,15,22 * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  actions: write # 允许启用/禁用工作流
  contents: read

jobs:
  enable-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable disabled scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 依次检查并启用：签到任务(run.yml)、保活任务(Keepalive)、本任务自身
          for wf in "run.yml" "Keepalive" "Workflow Watchdog"; do
            if gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              echo "OK: 已启用 $wf"
            else
              echo "INFO: 未找到或无需处理 $wf"
            fi
          done
